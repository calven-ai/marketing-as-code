# Slack app manifest for the team's marketing bot.
#
# Paste this file into https://api.slack.com/apps -> "Create New App" ->
# "From a manifest" (README.md next to this file has the click path).
# Rename "Marketing Bot" to whatever your team wants to see in Slack.
#
# Design constraints, on purpose:
#   - Bot token scopes only. No user token, so the bot never acts as a
#     person and never reads anything a person can see unless invited.
#   - No Request URL, no Events API, no interactivity, no Socket Mode.
#     Slack never calls us; the repo's scripts and GitHub Actions call
#     Slack with the bot token. No server to host, no signing secret.
#   - Reading and posting are limited to channels the bot is invited to.
#     No chat:write.public and no channels:join, so a script (or an agent
#     talked into running one) cannot reach a channel the team did not
#     choose. /invite the bot to the three configured channels.
#
# Resulting secret: one Bot User OAuth Token (starts with xoxb-), stored as
# SLACK_BOT_TOKEN in the GitHub environment `automation` (docs/secrets.md)
# and, for a person's own runs, in that person's .env (never committed).

_metadata:
  major_version: 1
  minor_version: 1

display_information:
  name: Marketing Bot
  description: Posts marketing updates from the marketing repo.
  long_description: >-
    Posts digests, proposal pointers and health alerts generated from the
    marketing-as-code repository, always linking the file each fact comes
    from. It only posts: reading a requests channel and answering in-thread
    is a second stage a team adds itself, with the scopes that stage needs.
    Anything that needs a human (pricing, product claims, customer quotes,
    written competitor comparisons, launch disclosure) is handed to the
    named owner instead of answered. Runs from scripts and GitHub Actions;
    it has no server and never acts as a person.
  background_color: "#1c1c1c"

features:
  bot_user:
    display_name: Marketing Bot
    always_online: false

oauth_config:
  scopes:
    bot:
      # Post announcements, only in channels the bot was invited to. The one
      # scope everything shipped needs: scripts/slack_post.py calls
      # chat.postMessage and nothing else. A leaked xoxb- token with only
      # this scope can post, not read.
      - chat:write
      #
      # Inbound intake (README.md next to this file, stage 2) is yours to
      # add. When you add it, uncomment what it needs and reinstall the app:
      #
      # Read the requests channel (public). The bot must be invited to it.
      # - channels:read
      # - channels:history
      # Acknowledge a request with an emoji (eyes = seen, check = answered,
      # raised hand = needs a human).
      # - reactions:write
      # Attach a file to a reply (a CSV snapshot, a Markdown one-pager).
      # - files:write
      # Resolve a requester's display name for the task that gets filed
      # ("asked by <name> in #marketing-requests"). No email access.
      # - users:read
      # Only needed if the requests channel is PRIVATE. Harmless otherwise:
      # the bot still sees only private channels it is invited to.
      # - groups:read
      # - groups:history

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
