name: housekeeping

# Weekly tidy-up, no AI, no key. Two jobs:
#
# "tidy" runs scripts/lint.py --fix on the approved copy and, if anything
# changed (a roster table, a missing .gitkeep, a file that needed renaming),
# opens one bookkeeping proposal "Housekeeping: <date>" that the gate then
# merges once the checks are green. It never merges by itself.
#
# "stale" marks proposals nobody touched for 14 days and closes them a week
# later, deleting the branch. A closed proposal is not lost: sync, then ask
# your agent to propose it again from today's approved copy.

on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tidy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Apply the safe fixes and open a proposal if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          python3 scripts/lint.py --fix --quiet || true
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to tidy."
            exit 0
          fi
          date="$(date -u +%Y-%m-%d)"
          branch="housekeeping/$date"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Housekeeping: $date"
          git push -u origin "$branch"
          gh pr create --title "Housekeeping: $date" --base "$BASE" --head "$branch" --body "$(cat <<'BODY'
          The weekly tidy-up: the safe fixes from `python3 scripts/lint.py --fix` applied to the approved copy (regenerated roster tables, missing `.gitkeep` files, line endings, file names).

          Nothing here changes what the team knows; it keeps the wiring straight. If the checks are green the gate merges this proposal. If you would rather look first, read the diff; it is short.
          BODY
          )"
          gh workflow run check.yml --ref "$branch"

  stale:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: -1
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: stale
          delete-branch: true
          stale-pr-message: >
            This proposal has had no activity for two weeks. In a week it closes and its branch is deleted.
            Nothing is lost: sync, then ask your agent to propose the change again from today's approved copy
            (docs/workflow.md). Comment here to keep it open.
          close-pr-message: >
            Closed for inactivity. To bring it back: sync, then ask your agent to propose it again.
