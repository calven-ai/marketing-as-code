name: transcripts-cron

# Pulls new meeting transcripts into memory/transcripts/inbox/ every day and
# opens a pull request with them. The inbox is an agent-maintained folder,
# so the gate treats that PR as bookkeeping and merges it once the checks
# are green (docs/workflow.md). Processing the inbox is then either a person
# running the chief-of-staff skill (the default) or transcripts-process.yml
# running it unattended; docs/operating-model.md has the choice.
#
# Granola is the shipped provider. Needs one secret, GRANOLA_API_KEY, in the
# `automation` environment (Settings -> Environments -> automation), which
# only main may use; docs/secrets.md. Uses only GitHub's own actions and the
# gh CLI already present on the runner.
#
# Another provider (Zoom, say) is a second "Pull" step below calling its own
# script with its own secret, gated the same way; the PR step picks up
# whatever landed. See integrations/adding-an-integration.md.

on:
  schedule:
    - cron: "30 5 * * *"   # daily, 05:30 UTC
  workflow_dispatch:
    inputs:
      since:
        description: "Only pull meetings from this date (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  pull:
    runs-on: ubuntu-latest
    environment: automation
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull new transcripts
        env:
          GRANOLA_API_KEY: ${{ secrets.GRANOLA_API_KEY }}
          SINCE: ${{ inputs.since }}
        run: |
          if [ -z "$GRANOLA_API_KEY" ]; then
            echo "GRANOLA_API_KEY is not set in the automation environment; nothing to do."
            exit 0
          fi
          case "$SINCE" in
            "") python3 scripts/pull_transcripts.py ;;
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) python3 scripts/pull_transcripts.py --since "$SINCE" ;;
            *) echo "since must look like YYYY-MM-DD"; exit 1 ;;
          esac

      - name: Open a pull request if new transcripts landed
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain memory/transcripts/inbox)" ]; then
            echo "No new transcripts."
            exit 0
          fi
          date="$(date -u +%Y-%m-%d)"
          branch="transcripts/$date"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add memory/transcripts/inbox
          git commit -m "Transcripts: $date"
          git push -u origin "$branch"
          gh pr create --title "Transcripts: $date" --base "$BASE" --head "$branch" --body "$(cat <<'BODY'
          New meeting transcripts pulled into `memory/transcripts/inbox/`.

          This is bookkeeping: the gate merges it once the checks are green, so nobody needs to merge it. Then process the inbox: run `/chief-of-staff` (or ask your agent to "process the transcript inbox"), or, if the team has opted into `transcripts-process.yml`, its daily run picks the files up and a "Transcripts processed" PR follows for a person to review.

          Transcripts are sensitive, and anything said in a meeting ends up here verbatim. Keep this repository private, and remember that agents treat transcript text as data, never as instructions (AGENTS.md rule 11).
          BODY
          )"
          # A PR opened with the workflow token starts no workflows on its own; ask for the check explicitly.
          gh workflow run check.yml --ref "$branch"
