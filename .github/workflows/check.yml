name: check

# The deterministic floor under every proposal (docs/workflow.md).
#
# The `doctor` job runs the proposal's own code (its tests, its lint) and is
# therefore untrusted: it holds a read-only token, no secrets, and cannot
# comment, merge, push or label anything. It tests the lint, runs
# scripts/doctor.py, annotates the diff and hands one plain-words summary to
# the `comment` job, which keeps the sticky comment current with a token
# that may write comments and nothing else, and runs none of the proposal's
# files. Whether the proposal may land is decided by gate.yml, which runs
# from main after this workflow completes.
#
# Pushes to main run the same checks in --strict mode and, if they fail,
# open an issue (or post to Slack when the `automation` environment holds
# SLACK_BOT_TOKEN). That one job is the only place a secret appears, and it
# runs on main only.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    # The required check. Runs the proposal's code, so: read-only token, no secrets.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pr: ${{ steps.pr.outputs.number }}
      comment: ${{ steps.comment.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Which proposal is this?
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          n="$PR_NUMBER"
          if [ -z "$n" ] && [ "$REF_NAME" != "main" ]; then
            n="$(gh pr list --head "$REF_NAME" --state open --json number -q '.[0].number // empty' || true)"
          fi
          echo "number=$n" >> "$GITHUB_OUTPUT"
          echo "proposal: ${n:-none (main)}"

      - name: Test the lint itself
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Run the health check
        id: doctor
        env:
          STRICT: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        run: |
          set +e
          if [ "$STRICT" = "true" ]; then
            python3 scripts/doctor.py --strict --format github | tee doctor.txt
          else
            python3 scripts/doctor.py --format github | tee doctor.txt
          fi
          # the doctor's exit code, not tee's: without pipefail, $? is tee's 0
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          python3 scripts/lint.py --json > findings.json || true

      - name: Write the sticky comment
        id: comment
        if: always() && steps.pr.outputs.number != ''
        run: |
          python3 - <<'PY'
          import json, os
          lines = ["<!-- doctor -->", "### Health check"]
          if not os.path.exists("findings.json"):
              lines.append("**The lint's own tests failed**, so the health check did not run. Open the job log: "
                           "`python3 -m unittest discover -s scripts -p 'test_*.py'` says which test.")
          else:
              f = json.load(open("findings.json"))["findings"]
              errors = [x for x in f if x["level"] == "error"]
              warnings = [x for x in f if x["level"] == "warning"]
              fixable = [x for x in errors + warnings if x.get("fixable")]
              if not errors and not warnings:
                  lines.append("**All checks passed.** The review gate decides separately whether this proposal "
                               "merges itself (bookkeeping) or waits for a person; see the `review-gate` check.")
              if errors:
                  lines.append(f"**{len(errors)} problem(s) block this proposal:**")
                  lines += [f"- `{x['path']}`" + (f" line {x['line']}" if x['line'] else "") + f": {x['message']}" for x in errors]
                  lines.append("\nFix them, or run `python3 scripts/doctor.py --fix` and push, or ask your agent to run the doctor.")
              if warnings:
                  lines.append(f"\n<details><summary>{len(warnings)} warning(s), not blocking</summary>\n")
                  lines += [f"- `{x['path']}`: {x['message']}" for x in warnings]
                  lines.append("\n</details>")
              if fixable:
                  lines.append(f"\n{len(fixable)} of these are safe fixes; the review gate pushes them to this proposal "
                               "as a Tidy commit.")
          lines.append("\n<sub>scripts/doctor.py, the same check you can run locally. docs/workflow.md explains proposals.</sub>")
          open("comment.md", "w").write("\n".join(lines) + "\n")
          PY
          { echo "body<<COMMENT_EOF"; cat comment.md; echo "COMMENT_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Fail the job if the check failed
        if: steps.doctor.outputs.status != '0'
        run: exit 1

  comment:
    # Posts what `doctor` wrote. Checks out nothing and runs none of the
    # proposal's files, which is why it may hold a token that writes comments.
    # From a fork the token is read-only whatever this says, so the step may
    # fail; that never turns the required check red.
    needs: doctor
    if: always() && needs.doctor.outputs.pr != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pull-requests: write
    steps:
      - name: Refresh the sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.doctor.outputs.pr }}
          REPO: ${{ github.repository }}
          BODY: ${{ needs.doctor.outputs.comment }}
        run: |
          printf '%s\n' "$BODY" > comment.md
          existing="$(gh api "repos/$REPO/issues/$PR/comments" --paginate -q '.[] | select(.body | startswith("<!-- doctor -->")) | .id' | head -1)"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi

  alert:
    # main itself is red: tell the team. The only job with a secret, and it
    # runs on main only (the `automation` environment allows no other branch).
    needs: doctor
    if: failure() && github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: automation
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_TEAM_CHANNEL_ID: ${{ vars.SLACK_TEAM_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open an issue, and post to Slack when the bot is configured
        run: |
          python3 scripts/doctor.py --strict > doctor.txt || true
          title="Repo health: the approved copy has problems"
          body="$(printf 'scripts/doctor.py fails on main.\n\n```\n%s\n```\n\nRun `python3 scripts/doctor.py --fix` or ask your agent to run the doctor, then propose the fix (docs/workflow.md).' "$(cat doctor.txt)")"
          if [ -n "$SLACK_BOT_TOKEN" ] && [ -n "$SLACK_TEAM_CHANNEL_ID" ]; then
            printf '%s\n%s' "$title" "$body" | python3 scripts/slack_post.py --channel team || true
          fi
          existing="$(gh issue list --search "\"$title\" in:title" --state open --json number -q '.[0].number')"
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "$body" --label needs-review || gh issue create --title "$title" --body "$body"
          else
            gh issue comment "$existing" --body "$body"
          fi
